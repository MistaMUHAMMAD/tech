<svg xmlns="http://www.w3.org/2000/svg" width="900" height="950" viewBox="0 0 900 950" role="img" aria-labelledby="title"><title id="title">Device troubleshooting decision tree</title><rect width="100%" height="100%" fill="#f5f8f6"/><style>text{font-family:Arial,sans-serif;fill:#102b35}.small{font-size:14px;fill:#526761}.node{fill:white;stroke:#a7c3b4;stroke-width:1.5}.label{font-size:18px;font-weight:600}.wire{fill:none;stroke:#41846a;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#41846a"/></marker></defs><text x="40" y="46" font-size="25" font-weight="600">Device troubleshooting</text><text class="small" x="40" y="75">Portfolio Sample | Generic first-line support decision path</text><rect class="node" x="245" y="108" width="410" height="80" rx="7"/><text class="label" x="450.0" y="140" text-anchor="middle">Capture the symptom</text><text class="small" x="450.0" y="165" text-anchor="middle">Device, user task, error and impact</text><path class="wire" d="M450 188v40" marker-end="url(#arrow)"/><path d="M450 228 640 298 450 368 260 298Z" fill="white" stroke="#a7c3b4" stroke-width="1.5"/><text x="450" y="295" class="label" text-anchor="middle">Does it power on?</text><text x="450" y="320" class="small" text-anchor="middle">After basic safety checks</text><path class="wire" d="M260 298H160v115M640 298h100v115" marker-end="url(#arrow)"/><text x="195" y="280" class="small">No</text><text x="680" y="280" class="small">Yes</text><rect class="node" x="40" y="420" width="320" height="85" rx="7"/><text class="label" x="200.0" y="452" text-anchor="middle">Check external power</text><text class="small" x="200.0" y="477" text-anchor="middle">Adapter, cable and power indicators</text><rect class="node" x="540" y="420" width="320" height="85" rx="7"/><text class="label" x="700.0" y="452" text-anchor="middle">Identify the affected area</text><text class="small" x="700.0" y="477" text-anchor="middle">OS, app, peripheral or connection</text><path class="wire" d="M200 505v55h500v-55M450 560v45" marker-end="url(#arrow)"/><rect class="node" x="245" y="612" width="410" height="85" rx="7"/><text class="label" x="450.0" y="644" text-anchor="middle">Record check and result</text><text class="small" x="450.0" y="669" text-anchor="middle">Use authorised, low-impact steps</text><path class="wire" d="M450 697v38" marker-end="url(#arrow)"/><rect class="node" x="245" y="743" width="410" height="85" rx="7"/><text class="label" x="450.0" y="775" text-anchor="middle">Verify or escalate</text><text class="small" x="450.0" y="800" text-anchor="middle">Test the original task; hand over evidence</text><text class="small" x="40" y="884">Stop use and escalate immediately for electrical hazards or serious physical damage.</text><text class="small" x="40" y="912">Record approved changes. Preserve user data and existing security controls.</text></svg>
