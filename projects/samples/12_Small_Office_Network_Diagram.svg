<svg xmlns="http://www.w3.org/2000/svg" width="920" height="720" viewBox="0 0 920 720" role="img" aria-labelledby="title"><title id="title">Illustrative small office network diagram</title><rect width="100%" height="100%" fill="#f5f8f6"/><style>text{font-family:Arial,sans-serif;fill:#102b35}.small{font-size:14px;fill:#526761}.node{fill:white;stroke:#a7c3b4;stroke-width:1.5}.label{font-size:18px;font-weight:600}.wire{fill:none;stroke:#41846a;stroke-width:2}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 7 3 0 6Z" fill="#41846a"/></marker></defs><text x="48" y="48" font-size="25" font-weight="600">Small office network</text><text class="small" x="48" y="78">Portfolio Sample | Illustrative topology | No employer configuration</text><path class="wire" d="M460 180v45M460 305v55M460 440v60M460 470H160v30M460 470h300v30"/><path class="wire" d="M460 400h300v-95"/><rect class="node" x="340" y="110" width="240" height="70" rx="7"/><text class="label" x="460.0" y="142" text-anchor="middle">Internet service</text><text class="small" x="460.0" y="167" text-anchor="middle">Illustrative connection</text><rect class="node" x="340" y="225" width="240" height="80" rx="7"/><text class="label" x="460.0" y="257" text-anchor="middle">Office router</text><text class="small" x="460.0" y="282" text-anchor="middle">Internet gateway</text><rect class="node" x="340" y="360" width="240" height="80" rx="7"/><text class="label" x="460.0" y="392" text-anchor="middle">Office switch</text><text class="small" x="460.0" y="417" text-anchor="middle">Wired network</text><rect class="node" x="650" y="225" width="220" height="80" rx="7"/><text class="label" x="760.0" y="257" text-anchor="middle">Wireless access point</text><text class="small" x="760.0" y="282" text-anchor="middle">Wi-Fi users</text><rect class="node" x="50" y="500" width="220" height="80" rx="7"/><text class="label" x="160.0" y="532" text-anchor="middle">Staff devices</text><text class="small" x="160.0" y="557" text-anchor="middle">Workstations / laptops</text><rect class="node" x="350" y="500" width="220" height="80" rx="7"/><text class="label" x="460.0" y="532" text-anchor="middle">Server / shared services</text><text class="small" x="460.0" y="557" text-anchor="middle">Optional server role</text><rect class="node" x="650" y="500" width="220" height="80" rx="7"/><text class="label" x="760.0" y="532" text-anchor="middle">Shared peripheral</text><text class="small" x="760.0" y="557" text-anchor="middle">Example printer</text><text class="small" x="48" y="650">Lines show illustrative connectivity, not approved security boundaries.</text><text class="small" x="48" y="677">Addressing, credentials and detailed configuration belong in restricted internal records.</text></svg>
